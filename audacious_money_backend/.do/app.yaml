# Digital Ocean App Platform Specification
# Backend API for Audacious Money
#
# This file defines the infrastructure-as-code for deploying the backend API
# to Digital Ocean App Platform. You can deploy using this spec with:
#   doctl apps create --spec .do/app.yaml
#
# Or use the Digital Ocean dashboard and import this spec.

name: audacious-money-backend
region: nyc  # New York datacenter (closest to US East Coast)

# Services
services:
  - name: api
    # GitHub Configuration
    github:
      repo: [YOUR_GITHUB_USERNAME]/audacious-money
      branch: main
      deploy_on_push: true  # Auto-deploy when code is pushed to main

    # Build Configuration
    source_dir: /audacious_money_backend
    build_command: bun install
    run_command: bash start.sh

    # HTTP Configuration
    http_port: 3001

    # Instance Configuration
    instance_count: 1
    instance_size_slug: basic-xxs  # 512MB RAM, $5/month
    # For production, consider: professional-xs (1GB, $12/month)

    # Health Check Configuration
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    # Environment Variables
    envs:
      # Node Environment
      - key: NODE_ENV
        value: production

      # Server Port
      - key: PORT
        value: "3001"

      # Database Configuration
      # IMPORTANT: Use connection pool URL from Task 6.1
      # Must end with ?sslmode=require
      - key: DATABASE_URL
        value: ${DATABASE_URL}
        type: SECRET

      # JWT Secret
      # CRITICAL: Generate with: openssl rand -hex 32
      # MUST match sync relay JWT_SECRET
      - key: JWT_SECRET
        value: ${JWT_SECRET}
        type: SECRET

      # Stripe Configuration
      # Get from Stripe Dashboard -> Developers -> API Keys
      - key: STRIPE_SECRET_KEY
        value: ${STRIPE_SECRET_KEY}
        type: SECRET

      # Stripe Webhook Secret
      # Will be configured in Task 6.3 after deployment
      # Leave as placeholder for now
      - key: STRIPE_WEBHOOK_SECRET
        value: ${STRIPE_WEBHOOK_SECRET}
        type: SECRET

      # SendGrid Email Configuration
      # Get from SendGrid Dashboard -> API Keys
      - key: SENDGRID_API_KEY
        value: ${SENDGRID_API_KEY}
        type: SECRET

      # Application URLs
      # Frontend application URL
      - key: APP_URL
        value: https://app.audacious.money

      # Admin panel URL
      - key: ADMIN_URL
        value: https://admin.audacious.money

      # CORS Configuration
      # CRITICAL: Must match frontend URLs exactly (including https://)
      # Comma-separated list, no spaces
      - key: ALLOWED_ORIGINS
        value: https://app.audacious.money,https://admin.audacious.money

      # Security Settings - Argon2 Password Hashing
      - key: ARGON2_MEMORY_COST
        value: "65536"

      - key: ARGON2_TIME_COST
        value: "3"

      - key: ARGON2_PARALLELISM
        value: "4"

      # Rate Limiting Configuration
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"  # 1 minute window

      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"  # Max 100 requests per minute

      - key: RATE_LIMIT_AUTH_MAX
        value: "5"  # Max 5 auth attempts per minute

    # Custom Domains
    domains:
      - domain: api.audacious.money
        type: PRIMARY
        zone: audacious.money

    # Alerts
    alerts:
      - rule: DEPLOYMENT_FAILED
      - rule: DOMAIN_FAILED

# Notes:
# 1. Replace [YOUR_GITHUB_USERNAME] with your actual GitHub username
# 2. Set all ${VARIABLE} values in Digital Ocean dashboard under Environment Variables
# 3. Custom domain requires CNAME record: api -> [app-name].ondigitalocean.app
# 4. SSL certificate auto-provisions via Let's Encrypt (takes 5-10 minutes)
# 5. Database firewall must include this app's outbound IP addresses
# 6. For production, increase instance_count to 2-3 for high availability
