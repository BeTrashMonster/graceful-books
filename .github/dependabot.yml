version: 2
updates:
  # npm dependencies - Production
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 10
    reviewers:
      - "dependabot"
    assignees:
      - "infrastructure-team"
    labels:
      - "dependencies"
      - "automation"
    commit-message:
      prefix: "chore(deps)"
      prefix-major: "chore(deps)!"
      prefix-minor: "chore(deps)"
      prefix-patch: "chore(deps)"
      include: "scope"
    allow:
      - dependency-type: "production"
      - dependency-type: "development"
    ignore:
      # Ignore major version updates for now (manual review)
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    pull-request-branch-name:
      separator: "/"
    rebase-strategy: "auto"
    # Group security updates together for faster review
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      production-dependencies:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # npm dependencies - Security-only updates (daily check)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - "security"
      - "dependencies"
      - "critical"
    commit-message:
      prefix: "security(deps)"
      include: "scope"
    # Only security updates in this configuration
    target-branch: "main"
    pull-request-branch-name:
      separator: "/security/"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    reviewers:
      - "dependabot"
    labels:
      - "github-actions"
      - "automation"
    commit-message:
      prefix: "ci(actions)"
      include: "scope"
    auto-merge:
      auto-merge-strategy: "squash"
      auto-merge-threshold: "all"
    pull-request-branch-name:
      separator: "/"
    rebase-strategy: "auto"
