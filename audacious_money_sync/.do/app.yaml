# Digital Ocean App Platform Specification
# Sync Relay for Audacious Money
#
# This file defines the infrastructure-as-code for deploying the sync relay
# (WebSocket server) to Digital Ocean App Platform.
#
# Deploy using:
#   doctl apps create --spec .do/app.yaml
#
# Or use the Digital Ocean dashboard and import this spec.

name: audacious-money-sync
region: nyc  # New York datacenter (same as backend for low latency)

# Services
services:
  - name: sync
    # GitHub Configuration
    github:
      repo: [YOUR_GITHUB_USERNAME]/audacious-money
      branch: main
      deploy_on_push: true  # Auto-deploy when code is pushed to main

    # Build Configuration
    source_dir: /audacious_money_sync
    build_command: bun install
    run_command: bun run src/index.ts

    # HTTP Configuration
    # WebSocket connections start as HTTP then upgrade
    http_port: 8080

    # Instance Configuration
    instance_count: 1
    instance_size_slug: basic-xxs  # 512MB RAM, $5/month
    # Scale to 2-3 instances for production if needed

    # Health Check Configuration
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    # Environment Variables
    envs:
      # Node Environment
      - key: NODE_ENV
        value: production

      # Server Port
      - key: PORT
        value: "8080"

      # Database Configuration
      # CRITICAL: Must be SAME connection pool URL as backend
      # Both services share the same database
      - key: DATABASE_URL
        value: ${DATABASE_URL}
        type: SECRET

      # JWT Secret
      # CRITICAL: Must EXACTLY match backend JWT_SECRET
      # Sync relay validates JWTs issued by backend
      # Mismatch will cause all authentication to fail
      - key: JWT_SECRET
        value: ${JWT_SECRET}
        type: SECRET

    # Custom Domains
    domains:
      - domain: sync.audacious.money
        type: PRIMARY
        zone: audacious.money

    # Alerts
    alerts:
      - rule: DEPLOYMENT_FAILED
      - rule: DOMAIN_FAILED

# WebSocket Configuration Notes:
# 1. Digital Ocean App Platform fully supports WebSocket connections
# 2. No special configuration needed - HTTP connections automatically upgrade
# 3. Clients connect to: wss://sync.audacious.money
# 4. Keep-alive ping/pong recommended to prevent connection timeout (60s default)
# 5. Custom domain requires CNAME: sync -> [app-name].ondigitalocean.app
# 6. SSL/TLS works for WebSocket (WSS) - auto-provisioned via Let's Encrypt

# Security Notes:
# 1. JWT_SECRET must match backend exactly - copy the same value
# 2. DATABASE_URL should use connection pool (not direct database URL)
# 3. Database firewall must include this app's outbound IP addresses
# 4. All WebSocket connections should authenticate via JWT token

# Deployment Notes:
# 1. Replace [YOUR_GITHUB_USERNAME] with your actual GitHub username
# 2. Set all ${VARIABLE} values in Digital Ocean dashboard
# 3. Verify JWT_SECRET matches backend before deploying
# 4. Test WebSocket connection after deployment with HTML test page
